name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  guards:
    name: guards (fmt + lint + typecheck + tdd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: prettier
        run: pnpm -C apps/web exec prettier --check .
      - name: eslint
        run: pnpm -C apps/web lint
      - name: typecheck
        run: pnpm -C apps/web typecheck
      - name: tdd-policy
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tdd-exempt')
        run: bash scripts/check-tdd.sh ${{ github.base_ref }}

  be-tests:
    name: backend (unit + component + endpoint e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib
      - run: cargo test --workspace --tests
      - run: cargo test -p agentgrove-api --test e2e

  fe-tests:
    name: frontend (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -C apps/web test

  live-e2e:
    name: live e2e (binary + playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: bash scripts/verify.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  security:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit
      - run: cargo audit --ignore RUSTSEC-2017-0008 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0021 --ignore RUSTSEC-2025-0140 --ignore RUSTSEC-2026-0185 --ignore RUSTSEC-2026-0186
