name: release

on:
  push:
    branches: [main]

# Only one release at a time — if two merges land in quick
# succession the second run waits for the first to finish so
# version numbers stay sequential.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 1. Bump version + create tag ────────────────────────────
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      skipped: ${{ steps.bump.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: bump
        run: |
          set -euo pipefail
          # Read current version from root Cargo.toml.
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "current=$CURRENT"

          # Check if this version is already tagged — if so, bump
          # the patch number. If not (e.g. someone manually bumped
          # the version in Cargo.toml), use it as-is.
          if git rev-parse "refs/tags/v$CURRENT" >/dev/null 2>&1; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            PATCH=$((PATCH + 1))
            # Bump minor every 100 patches to signal meaningful progress
            if [ "$PATCH" -ge 100 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            fi
            NEXT="${MAJOR}.${MINOR}.${PATCH}"
          else
            NEXT="$CURRENT"
          fi

          # If HEAD is already tagged with this version, skip.
          if git tag --points-at HEAD | grep -q "^v${NEXT}$"; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Already tagged v$NEXT — skipping."
            exit 0
          fi

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          # Patch version in workspace Cargo.toml + FE package.json.
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEXT\"/" Cargo.toml
          # Also update the workspace member crates that inherit
          # `version.workspace = true` — Cargo resolves the version
          # from the root, so only the root needs the bump.
          if [ -f apps/web/package.json ]; then
            sed -i "s/\"version\": \"$CURRENT\"/\"version\": \"$NEXT\"/" apps/web/package.json
          fi

          git add Cargo.toml apps/web/package.json || true
          git commit -m "chore: bump version to $NEXT [skip ci]" || true
          git tag "v$NEXT"
          git push origin main --tags

  # ── 2. Create GitHub Release (source-only) ──────────────────
  release:
    needs: tag
    if: needs.tag.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          set -euo pipefail
          VERSION="2.13.1"
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${VERSION}/git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 "git-cliff-${VERSION}/git-cliff"
          sudo mv git-cliff /usr/local/bin/
          git cliff --version

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          # The release job checks out the new tag (ref: tag), so HEAD is
          # exactly the release commit. `git cliff --current` renders the
          # range from the previous tag to this one, grouped by commit
          # type, with the automated version-bump commits filtered out.
          BODY=$(git cliff --config cliff.toml --current --strip all)
          # If there were no user-facing commits between tags (e.g. only
          # version bumps), fall back to a friendly one-liner rather than
          # publishing an empty release body.
          if [ -z "${BODY//[$' \t\n']/}" ]; then
            BODY="Maintenance release — no user-facing changes."
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          # No artifacts are generated — users check out the source
          # and run the project locally. GitHub still provides the
          # automatic source-code archives on the release page.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
