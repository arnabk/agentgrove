name: Bug report
description: Report a defect.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please confirm you can reproduce on the latest `main` before filing.
  - type: input
    id: os
    attributes:
      label: Operating system + version
      placeholder: "macOS 15.4 / Ubuntu 24.04 / Windows 11 22H2"
    validations: { required: true }
  - type: input
    id: rust
    attributes:
      label: Rust version (`rustc --version`)
    validations: { required: true }
  - type: input
    id: node
    attributes:
      label: Node version (`node -v`)
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal sequence that triggers the bug.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
